<nav class="navbar">
  <div class="nav-container">
    <a routerLink="/" class="brand">
      {{ config.name }}
    </a>
    <button class="menu-toggle" (click)="toggleMenu()">☰</button>
    <ul class="nav-links" [class.open]="menuOpen">
      <li><a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Inicio</a></li>
      <li><a routerLink="/experience" routerLinkActive="active">Experiencia</a></li>
      <li><a routerLink="/projects" routerLinkActive="active">Proyectos</a></li>
      <li><a routerLink="/engineering" routerLinkActive="active">Arquitectura</a></li>
      <li><a routerLink="/skills" routerLinkActive="active">Habilidades</a></li>
      <li><a routerLink="/contact" routerLinkActive="active">Contacto</a></li>
    </ul>
  </div>
</nav>
<main class="main-content">
  <router-outlet></router-outlet>
</main>
<footer class="footer">
  <p>© 2026 {{ config.name }} • Full Stack .NET Developer</p>
  <div class="social-links">
    <a href="{{ config.linkedin }}" target="_blank">LinkedIn</a>
