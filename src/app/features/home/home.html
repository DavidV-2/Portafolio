<section class="hero">

    <div class="person-image">
        <img src="images/hero.jpg">
    </div>
    
    <div class="hero-content">
        <h1>{{ config.name }}</h1>
        <h2>{{ config.title }}</h2>
        <p class="tagline">Constructing scalable, maintainable, and secure software architecture.</p>
        <div class="cta-group">
            <a routerLink="/projects" class="btn btn-primary">View Projects</a>
            <a href="javascript:void(0)" (click)="downloadCV()" class="btn btn-outline">Download CV</a>
            <a routerLink="/contact" class="btn btn-outline">Contact Me</a>
        </div>
    </div>    
</section>
