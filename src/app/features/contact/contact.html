<section class="contact-section">
    <div class="container">
        <h2 class="section-title">Connect with me</h2>
        <div class="contact-content">
            <div class="contact-info">
                <div class="contact-item">
                    <span class="label">Email</span>
                    <a href="mailto:{{ config.email }}">{{ config.email }}</a>
                </div>
                <div class="contact-item">
                    <span class="label">LinkedIn</span>
                    <a [href]="config.linkedin" target="_blank">{{ config.linkedin }}</a>
                </div>
                <div class="contact-item">
                    <span class="label">GitHub</span>
                    <a [href]="config.github" target="_blank">{{ config.github }}</a>
                </div>
            </div>
            
            <div class="contact-cta">
                
                <button class="btn btn-primary" (click)="openScriptModal()">
                    Send your CV by email
                </button>
                <button class="btn btn-secondary" (click)="downloadCV()">
                    Download Full CV
                </button>

                <p class="cta-text">
                    Are we a good fit for each other? I'm open to opportunities in architecture and full-stack development.
                </p>
            </div>
        </div>
    </div>

    <div class="modal-backdrop" *ngIf="showScriptModal" (click)="closeScriptModal()">
        <div class="modal-card" (click)="$event.stopPropagation()">
            <button class="close-btn" (click)="closeScriptModal()">&times;</button>
            <iframe 
                [src]="scriptUrlSafe" 
                frameborder="0" 
                width="100%" 
                height="450px"
                allow="autoplay">
            </iframe>
        </div>
    </div>
</section>
