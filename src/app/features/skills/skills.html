<section class="skills-section">
    <div class="container">
        <h2 class="section-title">Stack Técnico</h2>
        <div class="skills-grid">
            <div class="skill-category" *ngFor="let category of categoryNames">
                <h3>{{ category | titlecase }}</h3>
                <div class="skill-items">
                    <span class="skill-item" *ngFor="let skill of skills[category]">
                        {{ skill }}
                    </span>
                </div>
            </div>
        </div>
    </div>
</section>
